<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020912">

<title>SocialPulse AI – Social Media Analytics</title>

<link rel="icon" type="image/png" href="/socialpulse-logo.png">

<script src="https://cdn.tailwindcss.com"></script>


<style>

/* =========================================================
   STARTUP LOADER
========================================================= */

#sp-loader{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:22px;
    background:
        radial-gradient(
            circle at center,
            #08384a 0%,
            #04131f 42%,
            #020912 100%
        );
    opacity:1;
    visibility:visible;
    transition:opacity .25s ease,visibility .25s ease;
}

#sp-loader.sp-loader-hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.sp-loader-logo{
    width:115px;
    height:115px;
    object-fit:contain;
    border-radius:24px;
    filter:drop-shadow(0 0 24px rgba(0,220,255,.45));
    animation:sp-logo-pulse 1.8s ease-in-out infinite;
}

.sp-loader-title{
    margin:0;
    color:#e6f7fb;
    font-size:clamp(1.35rem,4vw,2rem);
    font-weight:700;
    letter-spacing:.04em;
}

.sp-loader-subtitle{
    margin:-12px 0 0;
    color:#8fb3c4;
    font-size:.85rem;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.sp-loader-bar{
    width:min(220px,55vw);
    height:3px;
    overflow:hidden;
    border-radius:99px;
    background:rgba(255,255,255,.12);
}

.sp-loader-bar::after{
    content:"";
    display:block;
    width:45%;
    height:100%;
    border-radius:inherit;
    background:linear-gradient(
        90deg,
        transparent,
        #25d9ff,
        #fff,
        transparent
    );
    animation:sp-loader-slide 1.15s ease-in-out infinite;
}

@keyframes sp-logo-pulse{
    0%,100%{
        transform:scale(1);
        filter:drop-shadow(0 0 18px rgba(0,220,255,.35))
    }

    50%{
        transform:scale(1.06);
        filter:drop-shadow(0 0 34px rgba(0,220,255,.7))
    }
}

@keyframes sp-loader-slide{
    from{transform:translateX(-150%)}
    to{transform:translateX(330%)}
}


/* =========================================================
   MAIN DESIGN
========================================================= */

:root{
    --bg:#020912;
    --mut:#8fb3c4;
    --txt:#e6f7fb;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:100px;
}

body{
    position:relative;
    isolation:isolate;
    margin:0;

    background:
        linear-gradient(
            145deg,
            #061322 0%,
            #020912 48%,
            #071526 100%
        );

    background-size:180% 180%;
    animation:none;

    color:var(--txt);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 78% 8%,
            #087e9d45,
            transparent 34%
        ),
        radial-gradient(
            ellipse at 8% 35%,
            #2544a333,
            transparent 38%
        ),
        radial-gradient(
            ellipse at 82% 82%,
            #0c766739,
            transparent 34%
        ),
        radial-gradient(
            circle,
            #8ceaff65 1px,
            transparent 1.6px
        ),
        radial-gradient(
            circle,
            #8ceaff40 1px,
            transparent 1.7px
        ),
        linear-gradient(
            #72d5ff08 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            #72d5ff08 1px,
            transparent 1px
        );

    background-size:
        130% 130%,
        140% 140%,
        135% 135%,
        113px 113px,
        173px 173px,
        48px 48px,
        48px 48px;

    background-position:
        0 0,
        100% 20%,
        40% 100%,
        20px 35px,
        75px 12px,
        0 0,
        0 0;

    animation:none;
}

body::after{
    content:"";
    position:fixed;
    inset:-45%;
    z-index:-2;
    pointer-events:none;

    background:
        conic-gradient(
            from 20deg at 50% 50%,
            transparent 0deg,
            #0ea5e91c 55deg,
            transparent 115deg,
            #8b5cf61c 185deg,
            transparent 245deg,
            #14b8a61c 310deg,
            transparent 360deg
        );

    filter:blur(45px);
    opacity:.65;

    animation:none;
}

.ambient{
    position:fixed;
    z-index:-1;
    pointer-events:none;

    width:25rem;
    height:25rem;

    border-radius:50%;
    filter:blur(45px);
    opacity:.13;

    animation:none;
}

.ambient.a{
    top:8%;
    right:-10rem;
    background:#06b6d4;
}

.ambient.b{
    bottom:4%;
    left:-12rem;
    background:#6366f1;
    animation-delay:-7s;
}

.ambient.c{
    top:45%;
    left:38%;
    width:19rem;
    height:19rem;
    background:#14b8a6;
    opacity:.09;
    animation-delay:-11s;
}


.grad{
    background:
        linear-gradient(
            90deg,
            #38bdf8,
            #22d3ee,
            #2dd4bf
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.pn{
    background:
        linear-gradient(
            145deg,
            #0c2036e8,
            #071424ed
        );

    border:1px solid #20516a99;
    border-radius:16px;
    padding:16px;

    box-shadow:
        0 12px 34px -24px #22d3ee,
        inset 0 1px #b9f5ff0a;

    backdrop-filter:blur(8px);

    transition:
        transform .3s,
        border-color .3s,
        box-shadow .3s;
}

.pn:hover{
    transform:translateY(-2px);
    border-color:#22d3ee88;

    box-shadow:
        0 16px 38px -24px #22d3ee66,
        inset 0 1px #b9f5ff12;
}

.pt{
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    background:
        linear-gradient(
            100deg,
            #0891b2,
            #22d3ee 60%,
            #2dd4bf
        );

    color:#03131f;
    font-weight:700;

    border-radius:10px;
    padding:9px 16px;

    transition:.3s;

    box-shadow:
        0 8px 24px -10px #22d3ee;

    cursor:pointer;
}

.btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

.sel{
    background:#08192be8;
    border:1px solid #20516a;
    border-radius:10px;
    padding:7px 11px;

    font-size:12px;
    color:var(--txt);

    backdrop-filter:blur(6px);
}

.icon{
    display:inline-block;
    flex:none;
    vertical-align:middle;
}

.icon-button{
    width:38px;
    height:38px;

    display:grid;
    place-items:center;

    border:1px solid #20516a;
    border-radius:12px;

    background:#0a1b2dcc;
    color:#a5f3fc;

    transition:.25s;
    cursor:pointer;
}

.icon-button:hover{
    color:#fff;
    border-color:#22d3ee;
    background:#0e3548;
    transform:translateY(-2px);
}

.metric-icon{
    width:48px;
    height:48px;

    border-radius:15px;

    display:grid;
    place-items:center;
    flex:none;

    background:
        linear-gradient(
            145deg,
            #ffffff12,
            #ffffff04
        );

    box-shadow:
        inset 0 1px #ffffff18,
        0 8px 20px -12px currentColor;
}

.float-icon{
    animation:icon-float 4s ease-in-out infinite;
}

.metric-icon svg{
    filter:drop-shadow(0 0 7px currentColor);
}

.brand-mark{
    width:42px;
    height:42px;
    margin:0 auto 6px;

    display:grid;
    place-items:center;

    border:1px solid #ffffff24;
    border-radius:14px;

    color:#fff;

    box-shadow:
        0 8px 20px -12px currentColor,
        inset 0 1px #ffffff30;
}

.brand-mark svg{
    width:29px;
    height:29px;
}

.upload-symbol{
    width:66px;
    height:66px;
    margin:auto;

    display:grid;
    place-items:center;

    border:1px solid #22d3ee66;
    border-radius:22px;

    background:
        radial-gradient(
            circle at 35% 25%,
            #22d3ee35,
            #0b2034
        );

    box-shadow:
        0 12px 32px -16px #22d3ee;

    color:#67e8f9;
}

.drop{
    background:
        linear-gradient(
            145deg,
            #0a213633,
            #07152466
        );
}

.drop.on{
    background:#22d3ee14;
    border-color:#22d3ee;
}

.sec{
    opacity:0;
    transform:translateY(40px);
    transition:
        opacity .9s,
        transform .9s cubic-bezier(.2,.7,.2,1);
}

.sec.in{
    opacity:1;
    transform:none;
}

.step{
    width:46px;
    height:46px;

    border-radius:50%;
    border:2px solid #22d3ee;

    display:grid;
    place-items:center;

    font-weight:700;
    color:#67e8f9;

    box-shadow:
        0 0 18px #22d3ee88;

    animation:ping2 2.2s infinite;
}

.globe{
    width:130px;
    height:130px;

    border-radius:50%;
    position:relative;

    background:
        radial-gradient(
            circle at 35% 30%,
            #22d3ee55,
            #0a3a52 45%,
            #041524 75%
        );

    border:1px solid #22d3ee66;

    box-shadow:
        0 0 40px -8px #22d3ee;

    animation:float 5s ease-in-out infinite;
}

.globe .platform-mark{
    position:absolute;

    width:34px;
    height:34px;

    border:1px solid #ffffff3b;
    border-radius:11px;

    display:grid;
    place-items:center;

    color:#fff;

    box-shadow:
        0 5px 16px #02091288;
}

.platform-mark svg{
    width:21px;
    height:21px;
    display:block;
}

.platform-float{
    animation:platform-float 3.6s ease-in-out infinite;
}

.influence-brand{
    width:48px;
    height:48px;

    display:grid;
    place-items:center;

    border-radius:50%;

    box-shadow:
        0 7px 20px -8px currentColor;
}

.influence-brand svg{
    width:26px;
    height:26px;
}

.ln{
    stroke-dasharray:1;
    stroke-dashoffset:1;
}

.in .ln{
    animation:dr 2s ease-out forwards;
}

.dn{
    opacity:0;
    transition:opacity 1s .3s;
}

.in .dn{
    opacity:1;
}

.hb{
    transform-origin:left;
    transform:scaleX(0);

    transition:
        transform 1.3s cubic-bezier(.2,.7,.2,1);
}

.in .hb{
    transform:none;
}

.vb{
    transform-origin:bottom;
    transform:scaleY(0);

    transition:
        transform 1.3s cubic-bezier(.2,.7,.2,1);
}

.in .vb{
    transform:none;
}

.dot{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;

    font-size:11px;
    color:#6f93a5;

    transition:.3s;
}

.dot b{
    width:7px;
    height:7px;

    border-radius:50%;
    background:#155e75;

    transition:.3s;
}

.dot.on,
.dot:hover{
    color:#67e8f9;
}

.dot.on b{
    background:#22d3ee;
    box-shadow:0 0 10px #22d3ee;
    transform:scale(1.5);
}

.ok{
    color:#2dd4bf;
}

.bad{
    color:#f87171;
}

.pu{
    animation:pu 2.4s ease-in-out infinite;
}

.hidden-section{
    display:none !important;
}

.mapping-row{
    display:grid;
    grid-template-columns:170px 1fr;
    gap:12px;
    align-items:center;
    padding:8px 0;
}

.mapping-label{
    font-size:12px;
    color:#c9e8f2;
}

.other-box{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.other-item{
    display:flex;
    align-items:center;
    gap:6px;

    padding:7px 9px;

    border:1px solid #20516a;
    border-radius:8px;

    background:#071827;

    font-size:11px;
    color:#9fc3d0;
}

.other-item input{
    accent-color:#22d3ee;
}

.report-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

@media(max-width:700px){

    .mapping-row{
        grid-template-columns:1fr;
        gap:5px;
    }

    .report-row{
        flex-direction:column;
        align-items:flex-start;
    }

}

@keyframes dr{
    to{
        stroke-dashoffset:0
    }
}

@keyframes float{
    50%{
        transform:translateY(-10px)
    }
}

@keyframes icon-float{
    0%,100%{
        transform:translateY(0)
    }

    50%{
        transform:translateY(-5px)
    }
}

@keyframes platform-float{
    0%,100%{
        transform:translateY(0) scale(1)
    }

    50%{
        transform:translateY(-7px) scale(1.06)
    }
}

@keyframes ambient-drift{
    to{
        transform:translate3d(3rem,-2rem,0) scale(1.12)
    }
}

@keyframes base-shift{
    0%{
        background-position:0% 20%
    }

    100%{
        background-position:100% 80%
    }
}

@keyframes backdrop-drift{
    0%{
        background-position:
            0 0,
            100% 20%,
            40% 100%,
            20px 35px,
            75px 12px,
            0 0,
            0 0
    }

    100%{
        background-position:
            8% 12%,
            84% 4%,
            55% 84%,
            55px 75px,
            130px 68px,
            24px 30px,
            24px 30px
    }
}

@keyframes aurora-turn{
    to{
        transform:rotate(360deg)
    }
}

@keyframes pu{
    50%{
        opacity:.5;
        transform:scale(1.25)
    }
}

#toast{
    position:fixed;
    left:50%;
    bottom:28px;

    transform:translate(-50%,80px);

    background:#06253a;
    border:1px solid #22d3ee;

    padding:10px 18px;

    border-radius:999px;

    font-size:13px;

    transition:.4s;

    z-index:9999;

    box-shadow:
        0 0 30px -6px #22d3ee;
}

#toast.show{
    transform:translate(-50%,0);
}

@media(prefers-reduced-motion:reduce){

    *{
        animation:none !important;
        transition:none !important;
    }

    .sec{
        opacity:1;
        transform:none;
    }

}

</style>
</head>


<body>

<!-- =========================================================
     LOADER
========================================================= -->

<div id="sp-loader" aria-label="Loading SocialPulse AI">

    <img
        class="sp-loader-logo"
        src="/socialpulse-logo.png"
        alt="SocialPulse AI"
    >

    <h1 class="sp-loader-title">
        SocialPulse AI
    </h1>

    <p class="sp-loader-subtitle">
        Social Media Analytics
    </p>

    <div
        class="sp-loader-bar"
        aria-hidden="true"
    ></div>

</div>


<!-- =========================================================
     BACKGROUND
========================================================= -->


<div class="ambient a"></div>
<div class="ambient b"></div>
<div class="ambient c"></div>


<!-- =========================================================
     HEADER
========================================================= -->

<header
    class="sticky top-0 z-40 h-[88px] md:h-[112px]
           flex items-center gap-3 px-4 md:px-10
           border-b border-cyan-900/50
           bg-[#030c18]/90 backdrop-blur"
>

    <a
        href="#upload"
        onclick="showUploadSection()"
        aria-label="SocialPulse home"
        class="flex items-center justify-center
               w-[112px] h-[78px]
               md:w-[144px] md:h-[102px]
               shrink-0 transition hover:scale-[1.02]"
    >

        <img
            src="/socialpulse-logo.png"
            alt="SocialPulse AI"
            class="w-full h-full object-contain"
        >

    </a>


    <label class="relative hidden sm:block w-64 ml-4">

        <svg
            class="icon absolute left-3 top-1/2
                   -translate-y-1/2 text-cyan-300"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
        >
            <circle cx="11" cy="11" r="7"/>
            <path d="m16 16 4 4"/>
        </svg>

        <input
            class="sel w-full pl-9"
            placeholder="Search social media data..."
        >

    </label>


    <div class="flex-1"></div>


    <!-- LIVE DATE + TIME + DOWNLOAD PDF REPORT BUTTON -->

    <div class="flex items-center gap-3">
        <div class="sel hidden md:flex items-center gap-2">

            <svg
                class="icon text-cyan-300"
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <rect
                    x="3"
                    y="5"
                    width="18"
                    height="16"
                    rx="2"
                />

                <path d="M16 3v4M8 3v4M3 10h18"/>
            </svg>

            <span id="current-date-time">
                Loading...
            </span>

        </div>

        <button
            class="btn text-xs hidden"
            id="downloadPdfHeaderBtn"
            onclick="downloadCurrentReportPDF()"
        >
        
            Download PDF Report
        </button>
    </div>


    <button
        aria-label="Notifications"
        onclick="toast('No new notifications')"
        class="icon-button ml-2"
    >

        <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
        >
            <path
                d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
            />
        </svg>

    </button>

</header>


<!-- =========================================================
     NAV DOTS
========================================================= -->

<nav
    id="dots"
    class="hidden md:flex fixed right-4 top-1/2
           -translate-y-1/2 z-40 flex-col gap-3"
>
</nav>


<!-- =========================================================
     MAIN
========================================================= -->

<main
    id="app"
    class="max-w-[1500px] mx-auto
           px-4 md:px-10 md:pr-28 pb-16"
>
</main>


<!-- =========================================================
     TOAST
========================================================= -->

<div id="toast"></div>


<!-- =========================================================
     SAVED REPORT MODAL
========================================================= -->

<div
    id="reports-modal"
    class="fixed inset-0 z-50 hidden
           bg-[#020912]/90 backdrop-blur
           overflow-y-auto p-4 md:p-10"
>

    <div
        class="max-w-4xl mx-auto
               bg-[#071524]
               border border-cyan-900/70
               rounded-2xl p-6
               shadow-[0_0_40px_-10px_rgba(34,211,238,0.2)]
               mt-[80px]"
    >

        <div
            class="flex justify-between items-center
                   mb-6 border-b border-cyan-900/50 pb-4"
        >

            <div>

                <h2 class="text-2xl font-bold text-cyan-300">
                    Saved Reports
                </h2>

                <p class="text-xs text-[var(--mut)]">
                    Previously analyzed social media datasets
                </p>

            </div>

            <button
                onclick="closeReports()"
                class="icon-button font-bold text-lg"
                aria-label="Close reports"
            >
                ✕
            </button>

        </div>


        <div
            id="reports-list"
            class="space-y-4"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   BASIC HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function getSessionId() {
    let sessionId = sessionStorage.getItem("sp_session_id");
    if (!sessionId) {
        // Fallback for crypto.randomUUID() if browser doesn't support it
        sessionId = crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
        sessionStorage.setItem("sp_session_id", sessionId);
    }
    return sessionId;
}

function toast(message){

    const t = $('toast');

    if(!t) return;

    t.textContent = message;

    t.classList.add('show');

    clearTimeout(t.__timer);

    t.__timer = setTimeout(
        () => t.classList.remove('show'),
        2600
    );
}


/* =========================================================
   ICONS
========================================================= */

const I = (name,size=20) => {

    const p = {

        search:
            '<circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/>',

        calendar:
            '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',

        bell:
            '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',

        file:
            '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',

        upload:
            '<path d="M12 16V4m-5 5 5-5 5 5"/><path d="M20 16.5v2A2.5 2.5 0 0 1 17.5 21h-11A2.5 2.5 0 0 1 4 18.5v-2"/>',

        chart:
            '<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 6-7"/>',

        posts:
            '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',

        users:
            '<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',

        eye:

function formatNumber(value){

    if(value === null || value === undefined){
        return '0';
    }

    const n = Number(value);

    if(!Number.isFinite(n)){
        return '0';
    }

    return n.toLocaleString(
        undefined,
        {
            maximumFractionDigits:2
        }
    );
}

function donut(data,totalLabel='Posts',size=140){

    if(!data.length){
        return `
            <div class="text-xs text-[var(--mut)] py-5">
                No data available.
            </div>
        `;
    }

    const total = data.reduce(
        (sum,x) => sum + Number(x.v || 0),
        0
    );

    if(total <= 0){
        return `
            <div class="text-xs text-[var(--mut)] py-5">
                No data available.
            </div>
        `;
    }

    const radius = 40;
    const circumference = 2 * Math.PI * radius;

    let offset = 0;

    const circles = data.map(x => {

        const length =
            (x.v / total) *
            circumference;

        const result = `
            <circle
                cx="60"
                cy="60"
                r="${radius}"
                fill="none"
                stroke="${x.c}"
                stroke-width="14"
                stroke-dasharray="${length-1.5} ${circumference}"
                stroke-dashoffset="${-offset}"
            />
        `;

        offset += length;

        return result;

    }).join('');

    return `

        <div
            class="relative shrink-0"
            style="
                width:${size}px;
                height:${size}px
            "
        >

            <svg
                viewBox="0 0 120 120"
                class="-rotate-90 w-full h-full"
            >
                ${circles}
            </svg>

            <div
                class="absolute inset-0
                       grid place-items-center
                       text-center leading-tight"
            >

                <div>

                    <b class="text-base">
                        ${formatNumber(total)}
                    </b>

                    <div
                        class="text-[10px]
                               text-[var(--mut)]"
                    >
                        ${totalLabel}
                    </div>

                </div>

            </div>

        </div>
    `;
}

function lineChart(values,color=C1){

    if(!values.length){
        return `
            <div class="text-xs text-[var(--mut)]">
                No trend data available.
            </div>
        `;
    }

    const W = 600;
    const H = 200;
    const L = 40;
    const B = 24;
    const T = 8;

    const max = Math.max(
        ...values,
        1
    ) * 1.1;

    const X = i =>
        L +
        i *
        (W-L-8) /
        Math.max(values.length-1,1);

    const Y = v =>
        T +
        (H-T-B) *
        (1-v/max);

    let svg = '';

    for(let k=0;k<=4;k++){

        const y =
            T +
            (H-T-B) *
            k /
            4;

        svg += `
            <line
                x1="${L}"
                x2="${W-8}"
                y1="${y}"
                y2="${y}"
                stroke="#164e63"
                stroke-opacity=".6"
            />

            <text
                x="${L-6}"
                y="${y+3}"
                text-anchor="end"
                fill="#7fa3b5"
                font-size="10"
            >
                ${formatNumber(max*(1-k/4))}
            </text>
        `;
    }

    const path = values.map(
        (v,i) =>
            `${i ? 'L' : 'M'}
             ${X(i).toFixed(1)}
             ${Y(v).toFixed(1)}`
    ).join(' ');

    svg += `
        <path
            class="ln"
            pathLength="1"
            d="${path}"
            fill="none"
            stroke="${color}"
            stroke-width="2"
        />
    `;

    return `
        <svg
            viewBox="0 0 ${W} ${H}"
            class="w-full"
        >
            ${svg}
        </svg>
    `;
}

function escapeHtml(value){

    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

/* =========================================================

========================================================= */

function updateDateTime(){

    const element =
        $('current-date-time');

    if(!element) return;

    const now = new Date();

    const date =
        now.toLocaleDateString(
            'en-US',
            {
                month:'short',
                day:'numeric',
                year:'numeric'
            }
        );

    const time =
        now.toLocaleTimeString(
            'en-US',
            {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit',
                hour12:true
            }
        );

    element.textContent =
        `${date} • ${time}`;
}

    1000
);

function rebuildDots(){

    const nav = $('dots');

    if(!nav) return;

    const sections =
        SECTION_DEFS.filter(
            s => {
                const el = $(s.id);

                return el &&
                    !el.classList.contains(
                        'hidden-section'
                    );
            }
        );

    nav.innerHTML =
        sections.map(
            s => `
                <a
                    href="#${s.id}"
                    class="dot"
                    data-id="${s.id}"
                >
                    ${s.label}
                    <b></b>
                </a>
            `
        ).join('');

    spy();
}


function spy(){

    const sections =
        SECTION_DEFS.filter(
            s => {
                const el = $(s.id);

                return el &&
                    !el.classList.contains(
                        'hidden-section'
                    );
            }
        );

    let current =
        sections.length
            ? sections[0].id
            : null;

    sections.forEach(
        s => {

            const element =
                $(s.id);

            if(
                element &&
                element.getBoundingClientRect().top
                <
                innerHeight * .45
            ){
                current = s.id;
            }

        }
    );

    document
        .querySelectorAll('.dot')
        .forEach(
            dot =>
                dot.classList.toggle(
                    'on',
                    dot.dataset.id === current
                )
        );
}


addEventListener(
    'scroll',
    spy,
    {passive:true}
);


/* =========================================================
   SECTION OBSERVER
========================================================= */

function setupSectionObserver(){

    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(
                    entry => {

                        if(
                            entry.isIntersecting &&
                            !entry.target.classList.contains(
                                'in'
                            )
                        ){

                            entry.target.classList.add(
                                'in'
                            );

                        }

                    }
                );

            },
            {
                threshold:.12
            }
        );

    document
        .querySelectorAll('.sec')
        .forEach(
            section =>
                observer.observe(section)
        );
}

const drop = $('drop');
const fileInput = $('file');


function setFile(file){

    if(!file){
        return;
    }

    if(!/\.csv$/i.test(file.name)){

        $('msg').textContent =
            'Please choose a .csv file.';

        $('msg').style.color =
            '#fca5a5';

        return;
    }


    if(file.size > 50 * 1024 * 1024){

        $('msg').textContent =
            'File exceeds 50MB.';

        $('msg').style.color =
            '#fca5a5';

        return;
    }


    chosenFile = file;

    $('fn').textContent =
        file.name;

    $('msg').textContent =
        'CSV selected. Inspecting columns...';

    $('msg').style.color =
        '#5eead4';

    inspectCSV(file);
}


fileInput.addEventListener(
    'change',
    event => {

        setFile(
            event.target.files[0]
        );

    }
);


['dragenter','dragover'].forEach(
    type => {

        drop.addEventListener(
            type,
            event => {

                event.preventDefault();

                drop.classList.add('on');

            }
        );

    }
);


['dragleave','drop'].forEach(
    type => {

        drop.addEventListener(
            type,
            event => {

                event.preventDefault();

                drop.classList.remove('on');

            }
        );

    }
);


drop.addEventListener(
    'drop',
    event => {

        const file =
            event.dataTransfer.files[0];

        setFile(file);

    }
);


/* =========================================================
   INSPECT CSV
========================================================= */

async function inspectCSV(file){

    try{

        const form =
            new FormData();

        form.append(
            'file',
            file
        );


        const response =
            await fetch(
                '/api/inspect',
                {
                    method:'POST',
                    headers: {
                        'session-id': getSessionId()
                    },
                    body:form
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.detail ||
                'Could not inspect CSV.'
            );

        }


        inspectedColumns =
            data.columns.map(
                x => String(x.name)
            );


        renderMapping(
            inspectedColumns
        );


        $('msg').textContent =
            `${data.filename} • ${data.rows.toLocaleString()} rows • Columns detected ✓`;

        $('msg').style.color =
            '#5eead4';


        toast(
            'CSV loaded successfully ✓'
        );

    }
    catch(error){

        console.error(error);

        $('msg').textContent =
            error.message ||
            'Could not inspect CSV.';

        $('msg').style.color =
            '#fca5a5';

        $('mapping-panel')
            .classList.add('hidden');

        toast(
            'CSV inspection failed'
        );

    }

}

function renderMapping(columns){

    const panel =
        $('mapping-panel');

    const fields =
        $('mapping-fields');

    const others =
        $('other-fields');


    panel.classList.remove(
        'hidden'
    );


    fields.innerHTML =
        requiredFields.map(
            field => `

            <div class="mapping-row">

                <label
                    class="mapping-label"
                    for="map-${field.key}"
                >
                    ${field.label}
                    ${
                        field.required
                            ? '<span class="text-red-400">*</span>'
                            : ''
                    }
                </label>

                <select
                    id="map-${field.key}"
                    class="sel w-full mapping-select"
                    data-field="${field.key}"
                >

                    ${
                        field.required
                        ?
                        ''
                        :
                        '<option value="">Not Available / Ignore</option>'
                    }

                    ${
                        field.required
                        ?
                        `<option value="">
                            -- Select ${field.label} --
                        </option>`
                        :
                        ''
                    }

                    ${
                        columns.map(
                            column => `
                                <option
                                    value="${escapeHtml(column)}"
                                >
                                    ${escapeHtml(column)}
                                </option>
                            `
                        ).join('')
                    }

                </select>

            </div>

            `
        ).join('');


    others.innerHTML =
        columns.map(
            (column,index) => `

                <label
                    class="other-item"
                    title="${escapeHtml(column)}"
                >

                    <input
                        type="checkbox"
                        class="other-checkbox"
                        value="${escapeHtml(column)}"
                    >

                    <span>
                        ${escapeHtml(column)}
                    </span>

                </label>

            `
        ).join('');


    document
        .querySelectorAll('.mapping-select')
        .forEach(
            select =>
                select.addEventListener(
                    'change',
                    updateMappingOptions
                )
        );


    updateMappingOptions();

}


function updateMappingOptions(){

    const selects =
        Array.from(
            document.querySelectorAll(
                '.mapping-select'
            )
        );


    const selectedValues =
        selects
            .map(
                select => select.value
            )
            .filter(Boolean);


    selects.forEach(
        select => {

            const current =
                select.value;

            Array.from(
                select.options
            ).forEach(
                option => {

                    if(
                        !option.value
                    ){
                        option.disabled =
                            false;
                        return;
                    }

                    option.disabled =
                        selectedValues.includes(
                            option.value
                        ) &&
                        option.value !== current;

                }
            );

        }
    );


    const textSelect =
        $('map-TEXT');

    const status =
        $('mapping-status');

    if(!textSelect || !status){
        return;
    }


    if(textSelect.value){

        status.textContent =
            'Post Text mapped ✓';

        status.className =
            'text-[10px] text-emerald-400';

    }
    else{

        status.textContent =
            'Post Text required';

        status.className =
            'text-[10px] text-red-400';

    }

}


/* =========================================================
   BUILD MAPPING
========================================================= */

function buildMapping(){

    const mapping = {};

    document
        .querySelectorAll('.mapping-select')
        .forEach(
            select => {

                if(
                    select.value
                ){

                    mapping[
                        select.dataset.field
                    ] =
                        select.value;

                }

            }
        );


    return mapping;
}


/* =========================================================
   ANALYZE BUTTON
========================================================= */

$('go').addEventListener(
    'click',
    analyzeCSV
);


async function analyzeCSV(){

    if(!chosenFile){

        toast(
            'Please select a CSV file first'
        );

        drop.animate(
            [
                {
                    transform:'translateX(-6px)'
                },
                {
                    transform:'translateX(6px)'
                },
                {
                    transform:'none'
                }
            ],
            {
                duration:300,
                iterations:2
            }
        );

        return;
    }


    const mapping =
        buildMapping();


    if(!mapping.TEXT){

        toast(
            'Post Text mapping is required'
        );

        $('map-TEXT')
            ?.focus();

        return;
    }


    const button =
        $('go');

    const original =
        button.innerHTML;


    button.disabled = true;

    button.innerHTML =
        `${I('chart',17)} Analyzing...`;


    $('msg').textContent =
        'Running AI analysis. Please wait...';

    $('msg').style.color =
        '#67e8f9';


    try{

        const form =
            new FormData();

        form.append(
            'file',
            chosenFile
        );

        form.append(
            'mapping_json',
            JSON.stringify(mapping)
        );


        const response =
            await fetch(
                '/api/analyze',
                {
                    method:'POST',
                    headers: {
                        'session-id': getSessionId()
                    },
                    body:form
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.detail ||
                'Analysis failed.'
            );

        }


        renderReportDashboard(
            data
        );


        $('upload')
            .classList.add(
                'hidden-section'
            );


        rebuildDots();


        window.scrollTo(
            {
                top:0,
                behavior:'smooth'
            }
        );


        toast(
            'Analysis completed successfully ✓'
        );


        $('msg').textContent =
            'Analysis completed successfully ✓';

        $('msg').style.color =
            '#5eead4';

    }
    catch(error){

        console.error(error);

        toast(
            error.message ||
            'Analysis failed'
        );

        $('msg').textContent =
            error.message ||
            'Analysis failed.';

        $('msg').style.color =
            '#fca5a5';

    }
    finally{

        button.disabled =
            false;

        button.innerHTML =
            original;

    }

}

   SENTIMENT

function renderSentiment(sentiment){

    if(!sentiment){

        $('sentiment').innerHTML =
            '';

        return;
    }


    const positive =
        Number(sentiment.positive || 0);

    const negative =
        Number(sentiment.negative || 0);

    const neutral =
        Number(sentiment.neutral || 0);

    const total =
        Number(
            sentiment.total ||
            positive + negative + neutral
        );


    const sentimentData = [

        {
            n:'Positive',
            v:positive,
            c:C2
        },

        {
            n:'Negative',
            v:negative,
            c:NG
        },

        {
            n:'Neutral',
            v:neutral,
            c:C3
        }

    const content =

        hdr(

        )

        +

        grid(
            'sm:grid-cols-3 items-stretch',

                'flame',
                'Negative',
                sentiment.negative_percentage ??

                NG

                    percentage(
                        neutral,
                        total

                '%',
                '↑ Neutral sentiment',
                C3

        +

            pn(
                'Sentiment Distribution',

/* =========================================================
   NETWORK GRAPH
========================================================= */

function renderNetwork(edges){

    if(!edges.length){

        return `
            <div
                class="text-xs
                       text-[var(--mut)]
                       py-12 text-center"
            >
                No network data available.
            </div>
        `;
    }


    const sources =
        [...new Set(
            edges.map(
                x => x.source
            )
        )].slice(0,6);


    const targets =
        [...new Set(
            edges.map(
                x => x.target
            )
        )].slice(0,8);


    const width = 420;
    const height = 260;

    const centerX = 210;
    const centerY = 130;


    let svg = '';


    sources.forEach(
        (source,i) => {

            const angle =
                i /
                Math.max(
                    sources.length,
                    1
                ) *
                Math.PI *
                2;

            const x =
                centerX +
                70 *
                Math.cos(angle);

            const y =
                centerY +
                70 *
                Math.sin(angle);


            svg += `

                <line
                    x1="${centerX}"
                    y1="${centerY}"
                    x2="${x}"
                    y2="${y}"
                    stroke="#22d3ee"
                    stroke-opacity=".45"
                />

                <circle
                    cx="${x}"
                    cy="${y}"
                    r="9"
                    fill="${C1}"
                    class="pu"
                />

            `;

        }
    );


    targets.forEach(
        (target,i) => {

            const angle =
                i /
                Math.max(
                    targets.length,
                    1
                ) *
                Math.PI *
                2;

            const x =
                centerX +
                160 *
                Math.cos(angle);

            const y =
                centerY +
                100 *
                Math.sin(angle);


            const source =
                sources[i %
                    Math.max(
                        sources.length,
                        1
                    )
                ];


            const sourceIndex =
                sources.indexOf(
                    source
                );


            const sourceAngle =
                sourceIndex /
                Math.max(
                    sources.length,
                    1
                ) *
                Math.PI *
                2;


            const sx =
                centerX +
                70 *
                Math.cos(sourceAngle);

            const sy =
                centerY +
                70 *
                Math.sin(sourceAngle);


            svg += `

                <line
                    x1="${sx}"
                    y1="${sy}"
                    x2="${x}"
                    y2="${y}"
                    stroke="#38bdf8"
                    stroke-opacity=".35"
                />

                <circle
                    cx="${x}"
                    cy="${y}"
                    r="6"
                    fill="${i%2 ? C3 : C4}"
                    class="pu"
                    style="
                        animation-delay:${i*.12}s
                    "
                />

            `;

        }
    );


    svg += `

        <circle
            cx="${centerX}"
            cy="${centerY}"
            r="20"
            fill="#0891b2"
            stroke="#67e8f9"
            stroke-width="3"
            class="pu"
        />

    `;


    return `
        <svg
            viewBox="0 0 ${width} ${height}"
            class="w-full"
        >
            ${svg}
        </svg>
    `;
}

/* =========================================================
   TREND GENERATOR
========================================================= */

function generateTrend(
    total,
    points=30
){

    const base =
        Math.max(
            Number(total) || 1,
            1
        );


    const result = [];

    let value =
        base * .55;


    for(
        let i=0;
        i<points;
        i++
    ){

        const wave =
            Math.sin(i/3.5) *
            base *
            .06;

        const noise =
            (Math.sin(i*1.73)+1) *
            base *
            .025;

        value =
            Math.max(
                1,
                value +
                (base-value)*.12 +
                wave +
                noise
            );

        result.push(
            Math.round(value)
        );

    }


    return result;

}


function percentage(
    value,
    total
){

    if(!total){
        return 0;
    }

    return Number(
        (
            value /
            total *
            100
        ).toFixed(2)
    );

}

async function loadReports(){

    const modal =
        $('reports-modal');

    const list =
        $('reports-list');

    );


    list.innerHTML = `

    try{

        const response =
            await fetch(
                '/api/reports',
                {
                    headers: {
                        'session-id': getSessionId()
                    }
                }
            );


        const reports =
            await response.json();


        if(!response.ok){

            throw new Error(
                reports.detail ||
                'Could not load reports.'
            );

        }


        if(
            !Array.isArray(reports) ||
            reports.length === 0
        ){

            list.innerHTML = `

                <div
                    class="text-center
                           py-10
                           text-slate-400
                           italic"
                >
                    No reports have been saved yet.
                    Analyze a CSV to create a report.
                </div>

            return;
        }


        list.innerHTML =
            reports
                .slice()
                .reverse()
                .map(
                    report => `

                    <div
                        class="pn
                               border
                               border-cyan-900/40
                               p-5 rounded-xl
                               bg-[#0a1b2d]/50"
                    >

                        <div

                        >

                                    class="text-xs
                                           text-[var(--mut)]
                                           mt-1"
                                >
                                    ${formatNumber(
                                        report.rows
                                    )}
                                    rows
                                </p>

                            </div>


                            <button
                                class="btn text-xs"
                                onclick="viewReport('${escapeJs(
                                    report.id
                                )}')"
                            >
                                ${I('eye',15)}
                                View Report
                            </button>

                        </div>

                    </div>

                    `
                ).join('');

    }
    catch(error){

        console.error(error);

        list.innerHTML = `

            <div
                class="text-center
                       py-10
                       text-red-400"
            >
                Cannot connect to FastAPI backend.
                Make sure the server is running.
            </div>

        `;

    }

}


function escapeJs(value){

    return String(value ?? '')
        .replace(/\\/g,'\\\\')
        .replace(/'/g,"\\'")
        .replace(/\n/g,'\\n')
        .replace(/\r/g,'\\r');

}

/* =========================================================
   DOWNLOAD PDF REPORT
========================================================= */

async function downloadCurrentReportPDF(){

    if(!currentReportId){

        toast(
            'Please open a report first.'
        );

        return;
    }


    const button =
        $('downloadPdfHeaderBtn');


    try{

        if(button){

            button.disabled = true;

            button.innerHTML =
                `${I('file',15)} Generating PDF...`;

        }


        const response =
            await fetch(
                `/api/reports/${encodeURIComponent(
                    currentReportId
                )}/pdf`,
                {
                    headers: {
                        'session-id': getSessionId()
                    }
                }
            );


        if(!response.ok){

            let message =
                'Could not generate PDF.';

            try{

                const errorData =
                    await response.json();

                if(errorData.detail){

                    message =
                        errorData.detail;

                }

            }
            catch(e){}

            throw new Error(
                message
            );

        }


        const blob =
            await response.blob();


        const url =
            window.URL.createObjectURL(
                blob
            );


        const link =
            document.createElement('a');


        link.href = url;


        link.download =
            'SocialPulse_AI_Report.pdf';


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        window.URL.revokeObjectURL(
            url
        );


        toast(
            'PDF downloaded ✓'
        );

    }
    catch(error){

        console.error(
            'PDF download failed:',
            error
        );


        toast(
            error.message ||
            'PDF generation failed.'
        );

    }
    finally{

        if(button){

            button.disabled = false;

            button.innerHTML =
                `${I('file',15)} Download PDF Report`;

        }

    }

}
